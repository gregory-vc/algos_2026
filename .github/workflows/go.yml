name: Go CI

on:
  push:
    branches: ["task/*", "main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: go build -v ./...

      - name: Test
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          if [[ "$BRANCH_NAME" =~ ^task/[0-9]+$ ]]; then
            make "task_${BRANCH_NAME#task/}"
          else
            make test
          fi
